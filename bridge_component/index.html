<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extension Bridge Reader</title>
</head>
<body>
  <script>
    const PAGE_REQUEST_NAMESPACE = "yt-summary-page-request";

    function sendMessageToStreamlitClient(type, data) {
      window.parent.postMessage(
        {
          isStreamlitMessage: true,
          type: type,
          ...((data && typeof data === "object") ? data : {})
        },
        "*"
      );
    }

    function setFrameHeight(height) {
      sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
    }

    function setComponentValue(value) {
      sendMessageToStreamlitClient("streamlit:setComponentValue", { value: value });
    }

    function markReady() {
      sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight(0);
    }

    function parsePayload(rawValue) {
      if (!rawValue) {
        return null;
      }
      try {
        return JSON.parse(rawValue);
      } catch (_error) {
        return {
          ok: false,
          error: "invalid_json"
        };
      }
    }

    function readPayload(storageKey, consume) {
      const sources = [window.localStorage, window.sessionStorage];
      for (const store of sources) {
        try {
          const rawValue = store.getItem(storageKey);
          if (!rawValue) {
            continue;
          }
          const parsed = parsePayload(rawValue);
          if (consume) {
            store.removeItem(storageKey);
          }
          return parsed || null;
        } catch (error) {
          return {
            ok: false,
            error: String((error && error.message) || error || "storage_read_failed")
          };
        }
      }
      return null;
    }

    function buildRequestId() {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
        return globalThis.crypto.randomUUID();
      }
      return `page_req_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function requestExtensionSummarize(args) {
      const sourceUrl = String((args && args.sourceUrl) || "").trim();
      if (!sourceUrl) {
        setComponentValue({ ok: false, error: "source_url_required" });
        return;
      }
      const requestId = String((args && args.requestId) || "").trim() || buildRequestId();
      const timeoutMs = Number((args && args.timeoutMs) || 15000);
      let settled = false;

      function finish(value) {
        if (settled) {
          return;
        }
        settled = true;
        window.removeEventListener("message", handleMessage);
        setComponentValue(value);
      }

      function handleMessage(event) {
        const data = event && event.data;
        if (!data || data.namespace !== PAGE_REQUEST_NAMESPACE) {
          return;
        }
        if (String(data.requestId || "") !== requestId) {
          return;
        }
        finish(data.payload || { ok: false, error: "empty_extension_response" });
      }

      window.addEventListener("message", handleMessage);
      window.parent.postMessage(
        {
          namespace: PAGE_REQUEST_NAMESPACE,
          action: "startSummarizeFlowFromPage",
          requestId,
          payload: {
            sourceUrl
          }
        },
        "*"
      );

      window.setTimeout(() => {
        finish({ ok: false, error: "extension_request_timeout" });
      }, timeoutMs);
    }

    function watchBridgePayload(args) {
      const payloadId = String((args && args.payloadId) || "");
      const storageKeyPrefix = String((args && args.storageKeyPrefix) || "");
      const consume = Boolean(args && args.consume);
      const storageKey = storageKeyPrefix + payloadId;
      const startedAt = Date.now();
      const timeoutMs = 15000;
      const intervalMs = 300;

      function tick() {
        const payload = readPayload(storageKey, consume);
        if (payload) {
          setComponentValue(payload);
          return;
        }
        if (Date.now() - startedAt >= timeoutMs) {
          setComponentValue(null);
          return;
        }
        window.setTimeout(tick, intervalMs);
      }

      tick();
    }

    window.addEventListener("message", (event) => {
      if (!event || !event.data || event.data.type !== "streamlit:render") {
        return;
      }
      const args = event.data.args || {};
      if (args.action === "requestExtensionSummarize") {
        requestExtensionSummarize(args);
        return;
      }
      watchBridgePayload(args);
    });

    markReady();
  </script>
</body>
</html>
