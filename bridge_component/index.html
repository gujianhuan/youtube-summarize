<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extension Bridge Reader</title>
</head>
<body>
  <script>
    const PAGE_REQUEST_NAMESPACE = "yt-summary-page-request";
    const PAGE_REQUEST_STORAGE_PREFIX = "yt-summary-page-request:";
    const PAGE_RESPONSE_STORAGE_PREFIX = "yt-summary-page-response:";
    const BROADCAST_CHANNEL_NAME = "yt-summary-broadcast-channel";

    // Initialize BroadcastChannel if available
    const broadcastChannel = (typeof window.BroadcastChannel === "function") 
      ? new window.BroadcastChannel(BROADCAST_CHANNEL_NAME)
      : null;

    function sendMessageToStreamlitClient(type, data) {
      window.parent.postMessage(
        {
          isStreamlitMessage: true,
          type: type,
          ...((data && typeof data === "object") ? data : {})
        },
        "*"
      );
    }

    function setFrameHeight(height) {
      sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
    }

    function setComponentValue(value) {
      sendMessageToStreamlitClient("streamlit:setComponentValue", { value: value });
    }

    function markReady() {
      sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight(0);
    }

    function parsePayload(rawValue) {
      if (!rawValue) {
        return null;
      }
      try {
        return JSON.parse(rawValue);
      } catch (_error) {
        return {
          ok: false,
          error: "invalid_json"
        };
      }
    }

    function readPayload(storageKey, consume) {
      const sources = [window.localStorage, window.sessionStorage];
      for (const store of sources) {
        try {
          const rawValue = store.getItem(storageKey);
          if (!rawValue) {
            continue;
          }
          const parsed = parsePayload(rawValue);
          if (consume) {
            store.removeItem(storageKey);
          }
          return parsed || null;
        } catch (error) {
          return {
            ok: false,
            error: String((error && error.message) || error || "storage_read_failed")
          };
        }
      }
      return null;
    }

    function buildRequestId() {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
        return globalThis.crypto.randomUUID();
      }
      return `page_req_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function writePayload(storageKey, value) {
      const serialized = JSON.stringify(value);
      for (const store of [window.localStorage, window.sessionStorage]) {
        try {
          store.setItem(storageKey, serialized);
        } catch (_error) {
          // Ignore storage write failures and keep other channels available.
        }
      }
    }

    function clearPayload(storageKey) {
      for (const store of [window.localStorage, window.sessionStorage]) {
        try {
          store.removeItem(storageKey);
        } catch (_error) {
          // Ignore storage cleanup failures.
        }
      }
    }

    function requestExtensionSummarize(args) {
      const sourceUrl = String((args && args.sourceUrl) || "").trim();
      if (!sourceUrl) {
        setComponentValue({ ok: false, error: "source_url_required" });
        return;
      }
      const requestId = String((args && args.requestId) || "").trim() || buildRequestId();
      const timeoutMs = Number((args && args.timeoutMs) || 60000);
      const requestStorageKey = `${PAGE_REQUEST_STORAGE_PREFIX}${requestId}`;
      const responseStorageKey = `${PAGE_RESPONSE_STORAGE_PREFIX}${requestId}`;
      let settled = false;
      let storagePollTimer = null;
      let timeoutTimer = null;
      const trace = [
        {
          stage: "bridge_component_request_created",
          ok: true,
          requestId: requestId,
          sourceUrl: sourceUrl,
          timeoutMs: timeoutMs
        }
      ];

      function finish(value) {
        if (settled) {
          return;
        }
        settled = true;
        if (storagePollTimer) {
          window.clearInterval(storagePollTimer);
        }
        if (timeoutTimer) {
          window.clearTimeout(timeoutTimer);
        }
        window.removeEventListener("message", handleMessage);
        if (broadcastChannel) {
          broadcastChannel.removeEventListener("message", handleBroadcastMessage);
        }
        clearPayload(requestStorageKey);
        if (!value || typeof value !== "object") {
          setComponentValue(value);
          return;
        }
        const debug = (value.debug && typeof value.debug === "object") ? value.debug : {};
        const existingAttempts = Array.isArray(debug.attempts) ? debug.attempts : [];
        setComponentValue({
          ...value,
          debug: {
            ...debug,
            requestId: requestId,
            sourceUrl: sourceUrl,
            timeoutMs: timeoutMs,
            attempts: [...trace, ...existingAttempts]
          }
        });
      }

      function handleMessage(event) {
        const data = event && event.data;
        if (!data || data.namespace !== PAGE_REQUEST_NAMESPACE) {
          return;
        }
        // 显式要求回包动作名，避免误抓广播请求
        if (data.action !== "summarizeFlowReply") {
          return;
        }
        if (String(data.requestId || "") !== requestId) {
          return;
        }
        trace.push({
          stage: "bridge_component_received_reply",
          ok: true
        });
        finish(data.payload || { ok: false, error: "empty_extension_response" });
      }

      function handleBroadcastMessage(event) {
        const data = event && event.data;
        if (!data || data.namespace !== PAGE_REQUEST_NAMESPACE) {
          return;
        }
        if (data.action !== "summarizeFlowReply") {
          return;
        }
        if (String(data.requestId || "") !== requestId) {
          return;
        }
        trace.push({
          stage: "bridge_component_received_broadcast_reply",
          ok: true
        });
        finish(data.payload || { ok: false, error: "empty_extension_response" });
      }

      window.addEventListener("message", handleMessage);
      if (broadcastChannel) {
        broadcastChannel.addEventListener("message", handleBroadcastMessage);
      }
      const requestEnvelope = {
        namespace: PAGE_REQUEST_NAMESPACE,
        action: "startSummarizeFlowFromPage",
        requestId,
        timestamp: Date.now(),
        payload: {
          sourceUrl
        }
      };

      clearPayload(responseStorageKey);
      try {
        writePayload(requestStorageKey, requestEnvelope);
        trace.push({
          stage: "bridge_component_write_storage_request",
          ok: true
        });
      } catch (error) {
        trace.push({
          stage: "bridge_component_write_storage_request_failed",
          ok: false,
          error: String((error && error.message) || error || "storage_write_failed")
        });
      }
      const notifiedTargets = new Set();
      const tryPost = (target, stageName, allowRepeat = false) => {
        if (!target || typeof target.postMessage !== "function") {
          return;
        }
        if (!allowRepeat && notifiedTargets.has(target)) {
          return;
        }
        if (!allowRepeat) {
          notifiedTargets.add(target);
        }
        try {
          trace.push({
            stage: stageName,
            ok: true
          });
          target.postMessage(requestEnvelope, "*");
        } catch (error) {
          trace.push({
            stage: `${stageName}_failed`,
            ok: false,
            error: String((error && error.message) || error || "postmessage_failed")
          });
        }
      };

      tryPost(window, "bridge_component_postmessage_to_self");
      tryPost(window.parent, "bridge_component_postmessage_to_parent");
      tryPost(window.top, "bridge_component_postmessage_to_top");

      let broadcastAttempt = 0;
      const broadcastRequest = () => {
        if (settled) return;
        broadcastAttempt += 1;
        if (broadcastChannel) {
          try {
            trace.push({
              stage: "bridge_component_broadcast_request",
              ok: true,
              retry: broadcastAttempt > 1,
              attempt: broadcastAttempt
            });
            broadcastChannel.postMessage(requestEnvelope);
          } catch (error) {
            trace.push({
              stage: "bridge_component_broadcast_request_failed",
              ok: false,
              error: String((error && error.message) || error || "broadcast_failed")
            });
          }
        }
        // Also re-trigger postMessage to self/parent/top in case of race conditions
        tryPost(window, "bridge_component_postmessage_to_self_retry", true);
        tryPost(window.parent, "bridge_component_postmessage_to_parent_retry", true);
        tryPost(window.top, "bridge_component_postmessage_to_top_retry", true);
      };

      // Send initial broadcast
      broadcastRequest();

      // Periodically re-broadcast for the first 10 seconds to handle extension injection race
      const reBroadcastTimer = window.setInterval(() => {
        if (settled || (Date.now() - requestEnvelope.timestamp > 10000)) {
          window.clearInterval(reBroadcastTimer);
          return;
        }
        broadcastRequest();
      }, 1000);

      storagePollTimer = window.setInterval(() => {
        const storageReply = readPayload(responseStorageKey, true);
        if (!storageReply || typeof storageReply !== "object") {
          return;
        }
        if (storageReply.namespace !== PAGE_REQUEST_NAMESPACE || storageReply.action !== "summarizeFlowReply") {
          return;
        }
        if (String(storageReply.requestId || "") !== requestId) {
          return;
        }
        trace.push({
          stage: "bridge_component_received_storage_reply",
          ok: true
        });
        finish(storageReply.payload || { ok: false, error: "empty_extension_response" });
      }, 250);

      timeoutTimer = window.setTimeout(() => {
        trace.push({
          stage: "bridge_component_wait_reply_timeout",
          ok: false,
          error: "extension_request_timeout"
        });
        finish({
          ok: false,
          error: "extension_request_timeout",
          helperMessage: `桥接页已等待插件响应 ${Math.round(timeoutMs / 1000)}s，但未收到回包。`,
          debug: {
            stage: "bridge_component_wait_reply",
            timeoutMs,
            requestId
          }
        });
      }, timeoutMs);
    }

    function watchBridgePayload(args) {
      const payloadId = String((args && args.payloadId) || "");
      const storageKeyPrefix = String((args && args.storageKeyPrefix) || "");
      const consume = Boolean(args && args.consume);
      const storageKey = storageKeyPrefix + payloadId;
      const startedAt = Date.now();
      const timeoutMs = 15000;
      const intervalMs = 300;

      function tick() {
        const payload = readPayload(storageKey, consume);
        if (payload) {
          setComponentValue(payload);
          return;
        }
        if (Date.now() - startedAt >= timeoutMs) {
          setComponentValue(null);
          return;
        }
        window.setTimeout(tick, intervalMs);
      }

      tick();
    }

    window.addEventListener("message", (event) => {
      if (!event || !event.data || event.data.type !== "streamlit:render") {
        return;
      }
      const args = event.data.args || {};
      if (args.action === "requestExtensionSummarize") {
        requestExtensionSummarize(args);
        return;
      }
      watchBridgePayload(args);
    });

    markReady();
  </script>
</body>
</html>
