<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transcript Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="wrap">
      <h1>Transcript Helper</h1>
      <p id="status" class="status">正在等待提取...</p>
      <div class="actions">
        <button id="extractBtn">提取字幕</button>
        <button id="copyBtn" disabled>复制文本</button>
        <button id="openBtn">打开总结站</button>
      </div>
      <label class="field">
        <span>标题</span>
        <input id="titleInput" readonly>
      </label>
      <label class="field">
        <span>来源链接</span>
        <input id="urlInput" readonly>
      </label>
      <label class="field">
        <span>提取结果</span>
        <textarea id="transcriptOutput" rows="14" placeholder="这里会显示提取到的字幕文本"></textarea>
      </label>
      <p class="hint">MVP 版先做“提取 + 复制 + 手动粘贴到主站”的稳定链路。</p>
    </main>
    <script src="popup.js"></script>
  </body>
  </html>
