<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transcript Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="wrap">
      <h1>Transcript Helper</h1>
      <p id="status" class="status">正在等待提取...</p>
      <div class="actions">
        <button id="extractBtn">提取字幕</button>
        <button id="copyBtn" disabled>复制文本</button>
        <button id="openBtn" disabled>一键总结</button>
      </div>
      <section id="helperPanel" class="helper-panel helper-panel-hidden">
        <h2 id="helperTitle">需要本地转写助手</h2>
        <p id="helperDesc" class="helper-desc"></p>
        <div class="helper-actions">
          <button id="helperGuideBtn" class="secondary-btn">查看本地工具引导</button>
          <button id="copyLinkBtn" class="secondary-btn">复制视频链接</button>
        </div>
      </section>
      <label class="field">
        <span>标题</span>
        <input id="titleInput" readonly>
      </label>
      <label class="field">
        <span>来源链接</span>
        <input id="urlInput" readonly>
      </label>
      <label class="field">
        <span>提取结果</span>
        <textarea id="transcriptOutput" rows="14" placeholder="这里会显示提取到的字幕文本"></textarea>
      </label>
      <p class="hint">MVP 版先做“提取 + 复制 + 手动粘贴到主站”的稳定链路。</p>
    </main>
    <script src="popup.js"></script>
  </body>
  </html>
