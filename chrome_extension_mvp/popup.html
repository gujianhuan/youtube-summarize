<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transcript Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="wrap">
      <h1 id="popupTitle">Transcript Helper</h1>
      <p id="status" class="status">Waiting for extraction...</p>
      <section id="progressPanel" class="progress-panel progress-panel-idle">
        <div class="progress-head">
          <span id="progressTitle">后台任务</span>
          <strong id="progressPercent">0%</strong>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <ol id="progressSteps" class="progress-steps">
          <li data-step="extract">提取字幕</li>
          <li data-step="upload">发送到主站</li>
          <li data-step="open">打开主站</li>
          <li data-step="done">开始总结</li>
        </ol>
      </section>
      <div class="actions">
        <button id="extractBtn">Extract</button>
        <button id="copyBtn" disabled>Copy</button>
        <button id="openBtn" disabled>Summarize</button>
      </div>
      <section class="config-panel">
        <h2 id="configTitle">Debug Config</h2>
        <label class="field">
          <span id="mainUrlLabel">Main Site URL</span>
          <input id="mainUrlInput" placeholder="e.g. http://127.0.0.1:8501/">
        </label>
        <label class="field">
          <span id="bridgeUrlLabel">Bridge URL</span>
          <input id="bridgeUrlInput" placeholder="e.g. https://youtube-summarize-bridge.onrender.com">
        </label>
        <div class="helper-actions">
          <button id="useLocalMainBtn" class="secondary-btn">Use Local</button>
          <button id="saveConfigBtn" class="secondary-btn">Save</button>
          <button id="resetConfigBtn" class="secondary-btn">Reset</button>
        </div>
      </section>
      <section id="helperPanel" class="helper-panel helper-panel-hidden">
        <h2 id="helperTitle">Local transcription helper recommended</h2>
        <p id="helperDesc" class="helper-desc"></p>
        <div class="helper-actions">
          <button id="helperGuideBtn" class="secondary-btn">Open Guide</button>
          <button id="copyLinkBtn" class="secondary-btn">Copy Video Link</button>
        </div>
      </section>
      <label class="field">
        <span id="titleLabel">Title</span>
        <input id="titleInput" readonly>
      </label>
      <label class="field">
        <span id="urlLabel">Source URL</span>
        <input id="urlInput" readonly>
      </label>
      <label class="field">
        <span id="transcriptLabel">Transcript</span>
        <textarea id="transcriptOutput" rows="14" placeholder="Extracted transcript text will appear here"></textarea>
      </label>
      <p id="popupHint" class="hint">The MVP focuses on a stable flow: extract, copy, then summarize on the main site.</p>
    </main>
    <script src="popup.js"></script>
  </body>
  </html>
